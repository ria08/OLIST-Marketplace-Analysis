<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OLIST Medallion Analytics Architecture">
  <defs>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #111; }
      .h { font: 700 20px Arial, sans-serif; fill: #111; }
      .p { font: 16px Arial, sans-serif; fill: #222; }
      .box { stroke: #1f2937; stroke-width: 2; rx: 16; ry: 16; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="700" y="72" text-anchor="middle" class="title">OLIST Medallion Analytics Architecture</text>

  <rect x="40" y="230" width="200" height="230" class="box" fill="#f3f4f6"/>
  <text x="140" y="268" text-anchor="middle" class="h">RAW CSV SOURCES</text>
  <text x="140" y="304" text-anchor="middle" class="p">• Orders &amp; Order Items</text>
  <text x="140" y="332" text-anchor="middle" class="p">• Customers &amp; Reviews</text>
  <text x="140" y="360" text-anchor="middle" class="p">• Geolocation data</text>

  <rect x="260" y="230" width="200" height="230" class="box" fill="#dbeafe"/>
  <text x="360" y="268" text-anchor="middle" class="h">BRONZE LAYER</text>
  <text x="360" y="304" text-anchor="middle" class="p">• Raw ingestion</text>
  <text x="360" y="332" text-anchor="middle" class="p">• Audit timestamps</text>
  <text x="360" y="360" text-anchor="middle" class="p">• Source fidelity</text>
  <text x="360" y="388" text-anchor="middle" class="p">  preserved</text>

  <rect x="480" y="230" width="200" height="230" class="box" fill="#fef3c7"/>
  <text x="580" y="268" text-anchor="middle" class="h">SILVER LAYER</text>
  <text x="580" y="304" text-anchor="middle" class="p">• Data type</text>
  <text x="580" y="332" text-anchor="middle" class="p">  standardization</text>
  <text x="580" y="360" text-anchor="middle" class="p">• Deduplication</text>
  <text x="580" y="388" text-anchor="middle" class="p">• Data quality validation</text>

  <rect x="700" y="230" width="200" height="230" class="box" fill="#dcfce7"/>
  <text x="800" y="268" text-anchor="middle" class="h">GOLD LAYER</text>
  <text x="800" y="304" text-anchor="middle" class="p">• Analytics-ready model</text>
  <text x="800" y="332" text-anchor="middle" class="p">• Star schema:</text>
  <text x="800" y="360" text-anchor="middle" class="p">  facts + dimensions</text>
  <text x="800" y="388" text-anchor="middle" class="p">• Business-ready marts</text>

  <rect x="920" y="230" width="200" height="230" class="box" fill="#ede9fe"/>
  <text x="1020" y="268" text-anchor="middle" class="h">POWER BI DASHBOARD</text>
  <text x="1020" y="304" text-anchor="middle" class="p">• Semantic model layer</text>
  <text x="1020" y="332" text-anchor="middle" class="p">• Order and item</text>
  <text x="1020" y="360" text-anchor="middle" class="p">  grain alignment</text>
  <text x="1020" y="388" text-anchor="middle" class="p">• Actionable insights</text>

  <rect x="1140" y="230" width="200" height="230" class="box" fill="#ffe4e6"/>
  <text x="1240" y="268" text-anchor="middle" class="h">BUSINESS IMPACT</text>
  <text x="1240" y="304" text-anchor="middle" class="p">• Improve customer</text>
  <text x="1240" y="332" text-anchor="middle" class="p">  retention</text>
  <text x="1240" y="360" text-anchor="middle" class="p">• Reduce late deliveries</text>
  <text x="1240" y="388" text-anchor="middle" class="p">• Support expansion</text>
  <text x="1240" y="416" text-anchor="middle" class="p">  beyond SE states</text>

  <line x1="240" y1="345" x2="260" y2="345" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="345" x2="480" y2="345" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="345" x2="700" y2="345" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="345" x2="920" y2="345" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1120" y1="345" x2="1140" y2="345" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="700" y="620" text-anchor="middle" class="p">Three-layer medallion design separates ingestion, governance, and consumption for trustworthy analytics.</text>
</svg>
